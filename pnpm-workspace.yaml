# Not a monorepo. This file exists because pnpm 10+ refuses to install when a
# dependency's build script is neither approved nor declined, and pnpm reads
# those approvals only from here — not from package.json's "pnpm" field and not
# from .npmrc. Left absent, pnpm 10+ regenerates it without a `packages` key.
#
# `packages` keeps the file valid for pnpm 9, which rejects a workspace file
# that has no `packages` and fails the install with "packages field missing or
# empty". Declaring only the root changes nothing for pnpm 10+: the lockfile is
# identical with or without it.
packages:
  - '.'

# sharp is deliberately declined: the Next image optimizer it backs never runs
# under `output: 'export'`, and nothing in this app imports next/image.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false

# next 15 pins postcss to exactly 8.4.31, which has the sourceMappingURL file
# disclosure and </style> escaping advisories fixed in 8.5.23. postcss only
# runs during `next build` and 8.5 is a compatible minor, so next gets the
# same patched postcss as the rest of the tree. Drop this once next's own
# pin reaches 8.5.23.
overrides:
  'next>postcss': ^8.5.23
