name: CI

# Test gate only. Deployment is owned by Cloudflare Workers Builds, which
# builds this repository directly on every push: pushes to main deploy to
# webdevhub.link, and every other branch is uploaded as a Worker version and
# gets its preview URLs posted to the pull request.
#
# So nothing here deploys, and Workers Builds does not wait for this
# workflow. What it does is fail a pull request, which keeps it out of
# production only when a ruleset on main requires this job's `build` check
# before merging. Workers Builds' build command, `pnpm build:checked`,
# repeats lint, typecheck and Vitest; the Playwright suite runs only here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a pull request's run. On main every push deploys,
  # so each one keeps its own result rather than being cancelled by the next.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned here rather than via a package.json "packageManager" field so
      # that the version CI installs is visible next to the job that uses it.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: Build static export
        run: pnpm build

      - name: Fail if the export is not fully static
        # `output: 'export'` writes ./out. If a dynamic route ever sneaks back
        # in, the build fails before this - but an empty or missing out/ would
        # otherwise sail through as a blank site.
        run: test -f out/index.html && test -f out/404.html

      # After the build so the export already exists; Playwright serves ./out
      # through wrangler, which is what production does with it.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 5
