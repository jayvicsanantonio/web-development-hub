name: Check links

# Link rot is this site's main failure mode: the resources are all external, so
# a link can break without anything in this repository changing. That is why
# this runs on a schedule rather than on push — a pull request cannot introduce
# most of these failures, and 400+ live HTTP requests would make CI slow and
# flaky if it gated merges.

on:
  schedule:
    # Mondays, 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      section:
        description: 'Limit to one section (exact title)'
        required: false
        type: string

concurrency:
  group: check-links
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check every resource URL
        id: check
        # An explicit `bash` runs with -o pipefail. The default shell does not,
        # so the pipe into tee reported tee's exit status and a run with broken
        # links passed.
        shell: bash
        # Passed through the environment rather than interpolated into the
        # script, where a crafted input would run as shell.
        env:
          SECTION: ${{ inputs.section }}
        run: |
          if [ -n "$SECTION" ]; then
            pnpm check:links --section "$SECTION" | tee report.txt
          else
            pnpm check:links | tee report.txt
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: report.txt
          retention-days: 30

      # The script exits non-zero only for genuinely broken links; 403/429
      # bot-protection responses are reported as inconclusive and ignored.
      # Keyed on the check step itself, so a failed install or checkout does
      # not file a link-rot issue.
      - name: Open an issue for broken links
        if: failure() && steps.check.outcome == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('report.txt')
              ? fs.readFileSync('report.txt', 'utf8')
              : '(the check wrote no report)';
            const broken = report
              .split('\n')
              .filter((line) => line.includes('[BROKEN]'))
              .join('\n');

            const title = 'Broken resource links detected';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'link-rot',
            });

            const body = [
              'The weekly link check found links that no longer resolve.',
              '',
              '```',
              broken || report.slice(-3000),
              '```',
              '',
              `[Full report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['link-rot'],
              });
            }
